name: Update Profile Card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate card
        env:
          USERNAME: shadowmonachy
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-card.js

      - name: Commit card if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg
          git diff --staged --quiet || git commit -m "Update profile card"
          git push
